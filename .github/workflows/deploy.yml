name: Deploy Next.js Frontend to Amazon S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. pnpm 설치
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      # 3. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. 의존성 설치
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. Next.js 빌드
      - name: Build project
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_USE_MOCK: ${{ secrets.NEXT_PUBLIC_USE_MOCK }}
        run: pnpm build

      # 6. 빌드 결과 확인
      - name: Verify build files
        run: |
          echo "===== out 폴더 확인 ====="
          test -d out

          echo "===== JS chunks 폴더 확인 ====="
          test -d out/_next/static/chunks

          echo "===== 생성된 JS 개수 ====="
          find out/_next/static/chunks -type f -name '*.js' | wc -l

          echo "===== 생성된 JS 파일 일부 ====="
          find out/_next/static/chunks -type f -name '*.js' | head -20

          echo "===== events/2 파일 확인 ====="
          find out/events -maxdepth 3 -type f | sort

      # 7. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 8. JS/CSS 등 정적 파일 먼저 업로드
      - name: Upload Next static assets
        run: |
          aws s3 sync ./out/_next/ s3://temon-frontend-dev/_next/ \
            --cache-control "public,max-age=31536000,immutable"

      # 9. HTML과 나머지 파일 업로드
      - name: Deploy site files to S3
        run: |
          aws s3 sync ./out/ s3://temon-frontend-dev/ \
            --exclude "_next/*" \
            --delete \
            --cache-control "no-cache"

      # 10. CloudFront 캐시 무효화
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"