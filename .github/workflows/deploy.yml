name: Deploy Next.js Frontend to Amazon S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. pnpm 설치
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      # 3. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. 의존성 설치
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 5. 운영 API 접근 확인
      - name: Verify production API
        run: |
          echo "===== 이벤트 목록 API 확인 ====="
          curl -fSs "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}/api/events" \
            -o /tmp/events.json

          head -c 300 /tmp/events.json
          echo

          echo "===== 이벤트 2 상세 API 확인 ====="
          curl -fSs "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}/api/events/2" \
            -o /tmp/event2.json

          head -c 300 /tmp/event2.json
          echo

      # 6. Next.js 빌드
      - name: Build project
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
          NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}

          # 운영 배포에서는 Mock을 사용하지 않음
          NEXT_PUBLIC_USE_MOCK: 'false'
        run: pnpm build

      # 7. 빌드 결과 검증
      - name: Verify build files
        run: |
          echo "===== out 폴더 확인 ====="
          test -d out

          echo "===== JS chunks 폴더 확인 ====="
          test -d out/_next/static/chunks

          echo "===== 생성된 JS 개수 ====="
          find out/_next/static/chunks -type f -name '*.js' | wc -l

          echo "===== 생성된 JS 파일 일부 ====="
          find out/_next/static/chunks -type f -name '*.js' | head -20

          echo "===== 이벤트 페이지 파일 확인 ====="
          find out/events -maxdepth 3 -type f | sort

          echo "===== events/2.html 존재 확인 ====="
          test -f out/events/2.html

          echo "===== events/2.html 404 검사 ====="
          if grep -qE \
            '404: This page could not be found|NEXT_HTTP_ERROR_FALLBACK;404' \
            out/events/2.html; then
            echo "ERROR: out/events/2.html이 404 페이지로 생성됐습니다."
            exit 1
          fi

          echo "SUCCESS: out/events/2.html이 정상적으로 생성됐습니다."

      # 8. AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 9. Next.js JS/CSS 정적 파일 먼저 업로드
      - name: Upload Next static assets
        run: |
          aws s3 sync ./out/_next/ s3://temon-frontend-dev/_next/ \
            --cache-control "public,max-age=31536000,immutable"

      # 10. HTML 및 나머지 파일 업로드
      - name: Deploy site files to S3
        run: |
          aws s3 sync ./out/ s3://temon-frontend-dev/ \
            --exclude "_next/*" \
            --delete \
            --cache-control "no-cache"

      # 11. S3 배포 결과 확인
      - name: Verify S3 deployment
        run: |
          echo "===== S3 events/2.html 확인 ====="
          aws s3api head-object \
            --bucket temon-frontend-dev \
            --key events/2.html

          echo "===== S3 JS 파일 개수 일부 확인 ====="
          aws s3 ls s3://temon-frontend-dev/_next/static/chunks/ \
            | head -20

      # 12. CloudFront 캐시 무효화
      - name: Invalidate CloudFront Cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "CloudFront invalidation ID: $INVALIDATION_ID"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      # 13. 캐시 무효화 완료 대기
      - name: Wait for CloudFront invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

          echo "CloudFront invalidation completed"

      # 14. 운영 페이지 최종 확인
      - name: Verify deployed event page
        run: |
          echo "===== 운영 events/2 응답 확인 ====="

          curl -fSs https://temon.shop/events/2 \
            -o /tmp/deployed-event2.html

          if grep -qE \
            '404: This page could not be found|NEXT_HTTP_ERROR_FALLBACK;404' \
            /tmp/deployed-event2.html; then
            echo "ERROR: 운영 events/2 페이지가 아직 404입니다."
            exit 1
          fi

          echo "SUCCESS: 운영 events/2 페이지가 정상입니다."