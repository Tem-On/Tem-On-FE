name: Deploy Next.js Frontend to Amazon S3

on:
  push:
    branches:
      - main  # 기본 브랜치가 master라면 master로 수정해 주세요!

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. pnpm 패키지 매니저 설치
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    # 3. Node.js 환경 구축
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'pnpm'

    # 4. 의존성 패키지 설치 (--no-frozen-lockfile 로 변경)
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    # 5. Next.js 빌드 (Secrets 환경 변수 주입)
    - name: Build project
      env:
        NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
        NEXT_PUBLIC_KAKAO_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_KAKAO_REDIRECT_URI }}
        NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        NEXT_PUBLIC_USE_MOCK: ${{ secrets.NEXT_PUBLIC_USE_MOCK }}
      run: pnpm build

    # 6. AWS 인증
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    # 7. S3 버킷으로 out 폴더 전달
    - name: Deploy to S3
      run: |
        aws s3 sync ./out s3://temon-frontend-dev --delete